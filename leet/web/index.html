<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>offline-leet</title>
  <script>
    try {
      if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light";
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/vendor/monaco/vs/editor/editor.main.css">
</head>
<body data-pane="problem">
  <header>
    <button id="roadmap-btn" class="ghost">&#10070; Roadmap</button>
    <button id="menu-btn" class="ghost" aria-label="Show problem list">&#9776; Problems</button>
    <div id="title"><span id="title-text">Loading…</span><span id="difficulty" class="pill"></span></div>
    <div class="spacer"></div>
    <button id="timer-btn" class="ghost" aria-live="off" hidden></button>
    <span id="save-state"></span>
    <button id="more-btn" class="ghost" aria-haspopup="true" aria-expanded="false" aria-controls="more-actions">&#8943; More</button>
    <div id="more-actions">
      <button id="custom-btn" class="ghost" title="Try your own test cases">Custom</button>
      <button id="solution-btn" class="ghost" title="Show the reference solution">Solution</button>
      <button id="reset-btn" class="ghost" title="Restore the starter code (your current code is backed up)">Reset</button>
      <button id="theme-btn" class="ghost"></button>
    </div>
    <button id="prev-btn" class="ghost" aria-label="Previous problem">&larr;</button>
    <button id="next-btn" class="ghost" aria-label="Next problem">&rarr;</button>
    <button id="run-btn" class="primary">Run <kbd id="run-hint"></kbd></button>
  </header>

  <main>
    <section id="left">
      <div id="statement" aria-label="Problem statement"></div>
      <div id="hints" hidden>
        <div id="hint-head">
          <span id="hint-label" class="muted"></span>
        </div>
        <div id="hint-list"></div>
      </div>
    </section>
    <div id="split-v" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize problem panel" tabindex="0"></div>
    <section id="work">
      <div id="editor" aria-label="Code editor"></div>
      <div id="split-h" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize results panel" tabindex="0"></div>
      <div id="results"><p class="muted">Run your code to see results here.</p></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    </section>
  </main>

  <nav id="tabs" role="tablist" aria-label="Panels">
    <button role="tab" data-pane="problem" aria-selected="true" aria-controls="left">Problem</button>
    <button role="tab" data-pane="code" aria-selected="false" aria-controls="editor" tabindex="-1">Code</button>
    <button role="tab" data-pane="results" aria-selected="false" aria-controls="results" tabindex="-1">Results</button>
  </nav>

  <aside id="drawer" role="dialog" aria-modal="true" aria-label="Problems" hidden>
    <div id="drawer-head">
      <strong>Problems</strong>
      <span id="progress-count" class="muted"></span>
      <button id="close-drawer" class="ghost" aria-label="Close">&times;</button>
    </div>
    <div id="drawer-tools">
      <input id="problem-search" type="search" placeholder="Search by name or number" aria-label="Search problems" autocomplete="off">
      <div id="problem-filter" role="group" aria-label="Filter problems">
        <button class="ghost" data-filter="all" aria-pressed="true">All</button>
        <button class="ghost" data-filter="todo" aria-pressed="false">To do</button>
        <button class="ghost" data-filter="due" aria-pressed="false">Due</button>
      </div>
      <button id="next-up" hidden></button>
    </div>
    <div id="problem-list"></div>
  </aside>
  <div id="scrim" hidden></div>

  <section id="roadmap" aria-label="Roadmap" hidden>
    <div id="roadmap-head">
      <strong>Roadmap</strong>
      <span id="roadmap-count" class="muted"></span>
      <div class="spacer"></div>
      <button id="roadmap-zoom-out" class="ghost" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button id="roadmap-zoom-in" class="ghost" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="roadmap-fit" class="ghost" title="Fit the whole roadmap">Fit</button>
    </div>
    <div id="roadmap-main">
      <div id="roadmap-stage">
        <div id="roadmap-body"></div>
        <section id="roadmap-stats" aria-label="Progress">
          <div id="stats-body">
            <dl id="stats-legend"></dl>
            <div id="stats-ring" role="img"></div>
          </div>
          <div id="stats-activity" hidden></div>
          <div id="stats-actions">
            <button id="random-btn" class="ghost" aria-label="Open a random unsolved problem" title="Random unsolved problem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            </button>
            <button id="clear-progress-btn" class="ghost" aria-label="Delete all progress" title="Delete all progress">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
            </button>
          </div>
        </section>
      </div>
      <aside id="roadmap-topic" aria-label="Topic problems" hidden>
        <div id="roadmap-topic-head">
          <strong id="roadmap-topic-name"></strong>
          <span id="roadmap-topic-count" class="muted"></span>
          <button id="roadmap-topic-close" class="ghost" aria-label="Close topic">&times;</button>
        </div>
        <div id="roadmap-topic-list"></div>
      </aside>
    </div>
  </section>

  <dialog id="solution" aria-label="Reference solution">
    <div id="solution-head">
      <strong>Reference solution</strong>
      <button id="solution-close" class="ghost" aria-label="Close">&times;</button>
    </div>
    <div id="solution-body"></div>
  </dialog>

  <dialog id="custom" aria-label="Custom test cases">
    <div id="custom-head">
      <strong>Custom tests</strong>
      <span id="custom-summary" class="muted"></span>
      <button id="custom-close" class="ghost" aria-label="Close">&times;</button>
    </div>
    <div id="custom-body">
      <pre id="custom-load-error" class="error-box" hidden></pre>
      <div id="custom-list" class="cases"></div>
      <form id="custom-form" autocomplete="off">
        <label for="custom-args">Input <span class="muted">JSON, one value per argument, one argument per line</span></label>
        <textarea id="custom-args" rows="3" spellcheck="false"></textarea>
        <label for="custom-expected">Expected <span class="muted">JSON, optional: leave it empty to just see the output</span></label>
        <textarea id="custom-expected" rows="2" spellcheck="false"></textarea>
        <p id="custom-error" class="error-box" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="custom-run" class="ghost">Run all</button>
          <button type="submit" id="custom-add" class="primary">Add and run</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <div id="confirm-message"></div>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" id="confirm-ok" class="primary" autofocus></button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/monaco/vs/loader.js"></script>
  <script src="/roadmap.js"></script>
  <script src="/app.js"></script>
</body>
</html>
