name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      # test_solutions.py runs the learner's own solution.py files, which are
      # unfinished by design, so it is not a check on the repo itself.
      - run: pytest --ignore=tests/test_solutions.py
      - run: leet validate
